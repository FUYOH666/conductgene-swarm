[project]
name = "conductgene-swarm"
version = "1.0.0"
description = "Supervisor-approved conduct QA with auditable Policy Genes — UCWS Singapore 2026"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Aleksandr Mordvinov" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.2",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
live = [
    "openai>=1.55.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "respx>=0.21.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]
ui = [
    "streamlit>=1.40.0",
    "pandas>=2.2.0",
]
retrieval = [
    "qdrant-client>=1.12.0",
]
mcp = [
    "mcp>=1.12.0",
]

[project.scripts]
conductgene = "conductgene.main:cli_main"
conductgene-serve = "conductgene.__main__:serve"
conductgene-ui = "conductgene.ui.app:main"
conductgene-mcp = "conductgene.mcp.server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires real external services (e.g. Qdrant); skipped when env unset",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
files = ["src/conductgene"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.coverage.run]
source = ["src/conductgene"]
omit = ["src/conductgene/ui/*"]

[tool.coverage.report]
# Baseline ratchet: offline CI cannot exercise live-stack modules (qdrant, discovery).
# Raise as live-path tests are added; do not lower.
fail_under = 77
show_missing = false
precision = 1

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
