[project]
name = "precedent-llm"
version = "2.2.0"
description = "Pull requests for AI judgment: human corrections to an LLM judge become scoped, versioned, eval-gated, reversible rules with an audit trail."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aleksandr Mordvinov" }]
keywords = [
    "llm-as-a-judge",
    "llm-evaluation",
    "human-in-the-loop",
    "ai-governance",
    "audit-trail",
    "policy-as-code",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.9.0",
    "pyyaml>=6.0.2",
    "httpx>=0.27.0",
    "rich>=13.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "respx>=0.21.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-PyYAML>=6.0.12",
]

[project.scripts]
precedent = "precedent.cli:main"
# so that `uvx precedent-llm demo` works without --from
precedent-llm = "precedent.cli:main"

[project.urls]
Homepage = "https://github.com/FUYOH666/precedent"
Repository = "https://github.com/FUYOH666/precedent"
Changelog = "https://github.com/FUYOH666/precedent/blob/main/CHANGELOG.md"
Issues = "https://github.com/FUYOH666/precedent/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The judge prompt is prose; wrapping it would change what the model reads.
"src/precedent/judge/llm.py" = ["E501"]
# SVG markup in f-strings reads better unwrapped.
"scripts/figures.py" = ["E501"]
# HTML templating reads better unwrapped.
"src/precedent/evidence.py" = ["E501"]
"scripts/site.py" = ["E501"]
"scripts/social.py" = ["E501"]
"benchmarks/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src/precedent"]
strict = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/precedent"]
omit = ["src/precedent/__main__.py"]

[tool.coverage.report]
fail_under = 85
show_missing = false
precision = 1

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
precedent = ["packs/**/*", "py.typed", "schemas/*.json"]
