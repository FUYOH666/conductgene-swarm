name: Bug report
description: Report incorrect behavior, test failure, or regression
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please run `./scripts/verify_all.sh` first and include the output if relevant.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. uv sync --extra dev
        2. uv run precedent demo
        3. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "precedent --version"
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Judge
      options:
        - heuristic
        - replay (cassette)
        - llm (local endpoint)
        - llm (hosted API)
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
