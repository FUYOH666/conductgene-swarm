name: Feature request
description: Suggest an enhancement or new capability
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What problem does this solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like it to work?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - judge
        - rules / gate
        - event log / audit
        - packs / data
        - benchmark
        - CLI
        - documentation
        - other
    validations:
      required: true

  - type: checkboxes
    id: governance
    attributes:
      label: Governance alignment
      options:
        - label: Keeps four-eyes approval and the gate in front of every rule change
          required: false
        - label: Feature includes audit trail or rollback path
          required: false
