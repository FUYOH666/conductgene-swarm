name: Rules gate

on:
  pull_request:
    paths: ["rules/**"]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: gate
        uses: ./ # zizmor: ignore[self-repository] -- the documented local-action form
        continue-on-error: true
        with:
          pack: collections-conduct
          rules: rules/proposed/*.yaml
          corrections: rules/corrections.yaml
          active: rules/active
      - name: Post the gate report on the pull request
        if: steps.gate.outputs.report != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPORT: ${{ steps.gate.outputs.report }}
        run: gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$REPORT"
      - name: Fail when a rule is blocked
        if: steps.gate.outcome == 'failure'
        run: exit 1
