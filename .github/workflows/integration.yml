name: Integration

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  qdrant:
    runs-on: ubuntu-latest

    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333

    env:
      CONDUCTGENE_QDRANT_URL: http://127.0.0.1:6333

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv python install 3.12

      - run: uv sync --extra dev --extra retrieval

      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:6333/readyz && exit 0
            sleep 2
          done
          echo "Qdrant did not become ready" >&2
          exit 1

      - name: Run integration tests
        run: uv run pytest tests/test_qdrant_integration.py -m integration -v --no-cov
