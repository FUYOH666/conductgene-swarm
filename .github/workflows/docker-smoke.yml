name: Docker smoke

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: docker build -t precedent .
      - name: The demo runs offline in the image
        run: |
          docker run --rm --network none precedent | tee demo.txt
          grep -q "BLOCKED" demo.txt && grep -q "PASSED" demo.txt
