name: Docker smoke

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t precedent .
      - name: Demo runs offline in the image
        run: docker run --rm --network none precedent | tee demo.txt && grep -q "BLOCKED" demo.txt && grep -q "PASSED" demo.txt
